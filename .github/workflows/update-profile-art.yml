name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *" # ~06:17 UTC daily
    - cron: "17 18 * * *" # ~18:17 UTC (2x daily for resilience)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache rembg model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-${{ runner.os }}
      - run: pip install -r scripts/requirements.txt
      - name: Generate assets (with retry)
        run: |
          for script in prep_photo.py make_ascii_svg.py make_info_card.py fetch_contributions.py render_heatmap_svg.py; do
            for i in 1 2 3; do
              python scripts/$script && break
              echo "Attempt $i for $script failed, retrying..."
              [ $i -lt 3 ] && sleep 30
            done || { echo "Failed $script after 3 attempts"; exit 1; }
          done
      - name: Validate SVGs
        run: |
          for svg in assets/*.svg; do
            if [ ! -s "$svg" ]; then
              echo "ERROR: $svg is empty" && exit 1
            fi
            if ! grep -q "<svg" "$svg"; then
              echo "ERROR: $svg is not valid SVG" && exit 1
            fi
          done
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "assets/source-prepped.png assets/mahesh-ascii.svg assets/info-card.svg data/contributions.json assets/contrib-heatmap.svg"
