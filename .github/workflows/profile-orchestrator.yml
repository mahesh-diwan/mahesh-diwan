name: Profile Orchestrator

on:
  schedule:
    - cron: "17 6 * * *" # Once daily at 06:17 UTC
  workflow_dispatch:

concurrency:
  group: profile-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run tests
        run: python -m pytest scripts/tests/ -v

      - name: Generate all assets
        run: python -m scripts build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: scripts

      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"
          hide_month_labels: "false"

      - name: Copy Pac-Man SVGs to assets
        run: |
          cp dist/pacman-contribution-graph.svg assets/pacman.svg 2>/dev/null || true
          cp dist/pacman-contribution-graph-dark.svg assets/pacman-dark.svg 2>/dev/null || true

      - name: Cap Pac-Man animation loop
        run: |
          # Indefinite SMIL loops keep 86 animation clocks running forever in
          # <img> context -> browser jank after a while. Play 2 loops (~2.7min),
          # then rest on the final frame.
          sed -i 's/repeatCount="indefinite"/repeatCount="2"/g' assets/pacman.svg assets/pacman-dark.svg

      - name: Validate SVGs
        run: |
          for svg in assets/*.svg; do
            if [ ! -s "$svg" ]; then
              echo "ERROR: $svg is empty" && exit 1
            fi
            if ! grep -q "<svg" "$svg"; then
              echo "ERROR: $svg is not valid SVG" && exit 1
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-assets
          path: |
            assets/
            data/
          retention-days: 1

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-assets
          path: ./

      - name: Commit and push generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/ data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile art [skip ci]"
          fi
          git fetch origin main
          git rebase origin/main
          git push
