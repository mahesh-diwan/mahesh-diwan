name: Update README dynamic sections

on:
  schedule:
    - cron: "35 6 * * *" # ~06:35 UTC daily (after other workflows)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install PyGithub requests feedparser

      - name: Fetch recent releases
        id: releases
        run: |
          python << 'EOF'
          import os
          from github import Github

          token = os.getenv('GITHUB_TOKEN')
          g = Github(token)
          user = g.get_user('mahesh-diwan')

          releases_list = []
          for repo in user.get_repos(type='public'):
              try:
                  rels = repo.get_releases()
                  if rels.totalCount > 0:
                      latest = rels[0]
                      releases_list.append({
                          'repo': repo.name,
                          'url': latest.html_url,
                          'tag': latest.tag_name,
                          'title': latest.title or latest.tag_name,
                          'date': latest.published_at.strftime('%Y-%m-%d')
                      })
              except:
                  pass

          releases_list.sort(key=lambda x: x['date'], reverse=True)
          releases_list = releases_list[:8]

          if releases_list:
              md = "| Repo | Release | Date |\n|------|---------|------|\n"
              for r in releases_list:
                  md += f"| [{r['repo']}](https://github.com/mahesh-diwan/{r['repo']}) | [{r['title']}]({r['url']}) | {r['date']} |\n"
          else:
              md = "*No recent releases found*"

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print(f'releases_md<<EOF', file=f)
              print(md, file=f)
              print('EOF', file=f)
          EOF

      - name: Update README
        run: |
          python << 'PYEOF'
          import os
          import re
          import requests
          from datetime import datetime

          readme_path = 'README.md'
          with open(readme_path, 'r') as f:
              content = f.read()

          # Update recent releases
          releases_md = os.getenv('RELEASES_MD', '')
          content = re.sub(
              r'<!-- RECENT_RELEASES:START -->.*?<!-- RECENT_RELEASES:END -->',
              f'<!-- RECENT_RELEASES:START -->\n{releases_md}\n<!-- RECENT_RELEASES:END -->',
              content,
              flags=re.DOTALL
          )

          # Update blog posts from Hashnode RSS
          try:
              import xml.etree.ElementTree as ET
              rss_url = 'https://mahesh1215.hashnode.dev/rss.xml'
              resp = requests.get(rss_url, timeout=15)
              resp.raise_for_status()
              root = ET.fromstring(resp.content)
              items = root.findall('.//item')[:4]
              if items:
                  blog_lines = []
                  for item in items:
                      title = item.find('title').text.strip()
                      link = item.find('link').text.strip()
                      pub_date = item.find('pubDate').text
                      date_str = datetime.strptime(pub_date, '%a, %d %b %Y %H:%M:%S %Z').strftime('%Y-%m-%d')
                      blog_lines.append(f"| [{title}]({link}) | {date_str} |")
                  blog_md = "| Post | Date |\n|------|------|\n" + "\n".join(blog_lines)

                  content = re.sub(
                      r'### `mahesh@github ~ \$ profile --recent-blog`\n\n\| Post.*?\n\n',
                      f'### `mahesh@github ~ $ profile --recent-blog`\n\n{blog_md}\n\n',
                      content,
                      flags=re.DOTALL
                  )
          except Exception as e:
              print(f"Blog update skipped: {e}")

          now = datetime.utcnow().strftime('%Y-%m-%d')
          content = re.sub(
              r'Last updated: \d{4}-\d{2}-\d{2}',
              f'Last updated: {now}',
              content
          )

          with open(readme_path, 'w') as f:
              f.write(content)

          print("README updated successfully")
          PYEOF
        env:
          RELEASES_MD: ${{ steps.releases.outputs.releases_md }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update README dynamic sections [skip ci]" --author="mahesh-diwan <91125460+mahesh-diwan@users.noreply.github.com>" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin HEAD:main
